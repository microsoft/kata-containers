apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-cc
handler: kata-cc
---
apiVersion: v1
kind: Pod
metadata:
  name: openvmm-kata-e2e
spec:
  runtimeClassName: kata-cc
  restartPolicy: Never
  containers:
    - name: busybox
      image: docker.io/library/busybox:latest
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - echo OPENVMM_KUBERNETES_E2E_STARTED; sleep 600
