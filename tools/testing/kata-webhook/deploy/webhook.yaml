apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-annotate-webhook
  labels:
    app: pod-annotate-webhook
spec:
  selector:
    matchLabels:
      app: pod-annotate-webhook
  replicas: 1
  template:
    metadata:
      labels:
        app: pod-annotate-webhook
    spec:
      containers:
        - name: pod-annotate-webhook
          # Imported on the node: docker save localhost/kata-webhook:genpolicy | ssh <node> sudo ctr -n k8s.io images import -
          image: localhost/kata-webhook:genpolicy
          imagePullPolicy: Never
          env:
            - name: RUNTIME_CLASS
              valueFrom:
                configMapKeyRef:
                  name: kata-webhook
                  key: runtime_class
                  optional: true
            - name: MIN_MEMORY_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: kata-webhook
                  key: min_memory_limit
                  optional: true
          args:
            - -tls-cert-file=/etc/webhook/certs/cert.pem
            - -tls-key-file=/etc/webhook/certs/key.pem
            - -exclude-namespaces=rook-ceph-system,rook-ceph,kube-system,sonobuoy
            - -genpolicy=/usr/local/bin/genpolicy
          volumeMounts:
            - name: webhook-certs
              mountPath: /etc/webhook/certs
              readOnly: true
            - name: genpolicy-cache
              mountPath: /cache
          resources:
            requests:
              cpu: "100m"
              memory: "250Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
                drop:
                    - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
                type: RuntimeDefault
      volumes:
        - name: webhook-certs
          secret:
            secretName: pod-annotate-webhook-certs
        - name: genpolicy-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pod-annotate-webhook
  labels:
    app: pod-annotate-webhook
spec:
  ports:
  - port: 443
    targetPort: 8080
  selector:
    app: pod-annotate-webhook
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kata-webhook
data:
  runtime_class: kata-openvmm
  # The OpenVMM SNP guest gets exactly the pod memory limit; 512Mi is its minimum.
  min_memory_limit: "512Mi"
