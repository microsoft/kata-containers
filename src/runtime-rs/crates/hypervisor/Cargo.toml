[package]
name = "hypervisor"
version = "0.1.0"
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-rt = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
go-flag = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
rust-ini = "0.18.0"
seccompiler = "0.5.0"
serde = { workspace = true }
serde_json = { workspace = true }
slog = { workspace = true }
slog-scope = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "fs", "process", "io-util"] }
vmm-sys-util = "0.11.0"
rand = { workspace = true }
path-clean = "1.0.1"
lazy_static = { workspace = true }
tracing = { workspace = true }
ttrpc = { workspace = true, features = ["async"] }
protobuf = { workspace = true }
oci-spec = { workspace = true }
futures = "0.3.25"
safe-path = "0.1.0"
crossbeam-channel = "0.5.6"
qapi = { version = "0.15", features = ["qmp", "async-tokio-all"] }
qapi-spec = "0.3.2"
qapi-qmp = "0.15.0"
hyperlocal = { workspace = true }
hyper = { workspace = true, features = ["client"] }

# Local dependencies
kata-sys-util = { workspace = true }
kata-types = { workspace = true }
logging = { workspace = true }
protocols = { workspace = true, features = ["async"] }
shim-interface = { workspace = true }
persist = { workspace = true }
ch-config = { workspace = true, optional = true }
tests_utils = { workspace = true }
tracing-subscriber = { version = "0.3", optional = true }

# Local dependencies: Dragonball
dragonball = { workspace = true, features = [
    "atomic-guest-memory",
    "virtio-vsock",
    "hotplug",
    "virtio-blk",
    "virtio-net",
    "virtio-fs",
    "vhost-net",
    "dbs-upcall",
    "virtio-mem",
    "virtio-balloon",
    "vhost-user-net",
    "host-device",
], optional = true }
dbs-utils = { workspace = true }

# OpenVMM dependencies
ovmm_virt = { workspace = true, optional = true }
virt_mshv = { workspace = true, optional = true }
openvmm_core = { workspace = true, optional = true }
openvmm_defs = { workspace = true, optional = true }
hypervisor_resources = { workspace = true, optional = true }
openvmm_resources = { workspace = true, optional = true }
openvmm_helpers = { workspace = true, optional = true }
vm_manifest_builder = { workspace = true, optional = true }
ovmm_mesh = { workspace = true, optional = true }
mesh_rpc = { workspace = true, optional = true }
ovmm_mesh_worker = { workspace = true, optional = true }
ovmm_pal_async = { workspace = true, optional = true }
ovmm_unix_socket = { workspace = true, optional = true }
openvmm_ttrpc_vmservice = { workspace = true, optional = true }
storvsp_resources = { workspace = true, optional = true }
scsidisk_resources = { workspace = true, optional = true }
netvsp_resources = { workspace = true, optional = true }
net_backend_resources = { workspace = true, optional = true }
virtio_resources = { workspace = true, optional = true }
vm_resource = { workspace = true, optional = true }
disk_backend_resources = { workspace = true, optional = true }
disk_blockdevice = { workspace = true, optional = true }
ovmm_vmm_core_defs = { workspace = true, optional = true }
ovmm_guid = { workspace = true, optional = true }
ovmm_memory_range = { workspace = true, optional = true }
ovmm_serial_socket = { workspace = true, optional = true }

[features]
default = []

dragonball = ["dep:dragonball"]
# Feature is not yet complete, so not enabled by default.
# See https://github.com/kata-containers/kata-containers/issues/6264.
cloud-hypervisor = ["ch-config"]

# Enable the built-in OpenVMM (MSHV-backed) hypervisor
openvmm = [
    "dep:virt_mshv",
    "dep:ovmm_virt",
    "dep:openvmm_core",
    "dep:openvmm_defs",
    "dep:openvmm_resources",
    "dep:hypervisor_resources",
    "dep:openvmm_helpers",
    "dep:vm_manifest_builder",
    "dep:ovmm_mesh",
    "dep:mesh_rpc",
    "dep:ovmm_mesh_worker",
    "dep:ovmm_pal_async",
    "dep:ovmm_unix_socket",
    "dep:openvmm_ttrpc_vmservice",
    "dep:storvsp_resources",
    "dep:scsidisk_resources",
    "dep:netvsp_resources",
    "dep:net_backend_resources",
    "dep:virtio_resources",
    "dep:vm_resource",
    "dep:disk_backend_resources",
    "dep:disk_blockdevice",
    "dep:ovmm_vmm_core_defs",
    "dep:ovmm_guid",
    "dep:ovmm_memory_range",
    "dep:ovmm_serial_socket",
    "dep:tracing-subscriber",
]

[dev-dependencies]
serial_test = "2.0.0"
tempfile = { workspace = true }

# Local dev-dependencies
# Force the CH tests to run, even when the feature is not enabled for
# a normal build.
hypervisor = { workspace = true, features = ["cloud-hypervisor"] }
test-utils = { workspace = true }

[build-dependencies]
ttrpc-codegen = "0.6.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("enable-vendor"))',
] }
