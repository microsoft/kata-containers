\* TLC model-check configuration for the SRM lifecycle model.
\* A small finite set of operation identifiers and plan digests is sufficient
\* to exercise all interleavings of the two-phase lifecycle, plan binding,
\* retirement, abandonment and quarantine. MaxCommits bounds the otherwise
\* unbounded version counter (prepare/commit/retire may repeat forever).
SPECIFICATION Spec

CONSTANTS
    Ops = {o1, o2}
    Digests = {d1, d2}
    MaxCommits = 3

\* Listed individually rather than conjoined, so TLC names the invariant that
\* actually fired. mutation-test.py asserts that each mutant is caught by the
\* specific property it targets, which a single bundled invariant would make
\* impossible to check.
INVARIANTS
    TypeOK
    VersionCountsAllCommits
    CommittedIsPlanBound
    QuarantineHasCause
    DivergenceImpliesQuarantine
    InFlightIsAuthorized

PROPERTIES
    QuarantineSticky
    QuarantineAdmitsOnlyTeardown
    QuarantineGatesExecute
    SupersedingIsConfined
    VersionMonotone
