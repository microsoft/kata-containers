---
apiVersion: v1
kind: ReplicationController
metadata:
  name: echoheaders-https
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: echoheaders-https
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      runtimeClassName: kata
      securityContext:
        supplementalGroups:
          - 1
          - 2
          - 3
          - 4
          - 6
          - 10
          - 11
          - 20
          - 26
          - 27
      containers:
        - name: echoheaders-https
          image: "registry.k8s.io/e2e-test-images/agnhost:2.41"
          command:
            - /agnhost
            - netexec
            - "--http-port=8080"
            - "--tls-cert-file=/localhost.crt"
            - "--tls-private-key-file=/localhost.key"
          ports:
            - containerPort: 8080
