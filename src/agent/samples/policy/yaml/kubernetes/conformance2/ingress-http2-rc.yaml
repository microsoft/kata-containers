---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echoheaders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echoheaders
  template:
    metadata:
      labels:
        app: echoheaders
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      runtimeClassName: kata
      securityContext:
        supplementalGroups:
          - 1
          - 2
          - 3
          - 4
          - 6
          - 10
          - 11
          - 20
          - 26
          - 27
      containers:
        - name: echoheaders
          image: "registry.k8s.io/e2e-test-images/agnhost:2.40"
          command:
            - /agnhost
            - netexec
            - "--http-port=8443"
            - "--tls-cert-file=/localhost.crt"
            - "--tls-private-key-file=/localhost.key"
          ports:
            - containerPort: 8443
