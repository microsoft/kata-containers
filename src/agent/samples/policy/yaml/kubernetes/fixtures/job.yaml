---
apiVersion: batch/v1
kind: Job
metadata:
  name: pi
spec:
  template:
    metadata:
      name: pi
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      restartPolicy: Never
      runtimeClassName: kata
      containers:
        - name: pi
          image: "marinerconfpodstest.azurecr.io/acc-perl:1.0"
          command:
            - perl
            - "-Mbignum=bpi"
            - "-wle"
            - print bpi(2000)
  backoffLimit: 4
