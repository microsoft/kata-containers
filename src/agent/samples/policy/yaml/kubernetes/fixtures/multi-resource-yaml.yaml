---
apiVersion: v1
kind: ReplicationController
metadata:
  name: first-rc
spec:
  replicas: 1
  selector:
    app: mock
  template:
    metadata:
      labels:
        app: mock
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      runtimeClassName: kata
      containers:
        - name: mock-container
          image: "registry.k8s.io/pause:3.9"
          securityContext:
            runAsUser: 65535
