---
apiVersion: v1
kind: ReplicationController
metadata:
  name: nginx
spec:
  replicas: 3
  selector:
    app: nginx
  template:
    metadata:
      name: nginx
      labels:
        app: nginx
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      runtimeClassName: kata
      containers:
        - name: nginx
          image: "marinerconfpodstest.azurecr.io/azurelinux/base/nginx:1.25"
          ports:
            - containerPort: 80
