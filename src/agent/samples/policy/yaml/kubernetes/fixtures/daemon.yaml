---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: prometheus-node-exporter
spec:
  selector:
    matchLabels:
      daemon: prom-node-exp
      katacontainers.io/kata-runtime: "true"
  template:
    metadata:
      name: prometheus-node-exporter
      labels:
        daemon: prom-node-exp
        katacontainers.io/kata-runtime: "true"
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      runtimeClassName: kata
      securityContext:
        runAsUser: 1000
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: c
          image: "mcr.microsoft.com/aks/e2e/library-busybox:master.220314.1-linux-amd64"
          ports:
            - containerPort: 9090
              hostPort: 9090
              name: serverport
