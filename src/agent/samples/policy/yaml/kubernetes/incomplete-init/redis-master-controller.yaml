---
apiVersion: v1
kind: ReplicationController
metadata:
  name: redis-master
  labels:
    app: redis
    role: master
    tier: backend
spec:
  replicas: 1
  template:
    metadata:
      labels:
        app: redis
        role: master
        tier: backend
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      runtimeClassName: kata
      securityContext:
        supplementalGroups:
          - 1
          - 2
          - 3
          - 4
          - 6
          - 10
          - 11
          - 20
          - 26
          - 27
      containers:
        - name: master
          image: "docker.io/library/redis:5.0.5-alpine"
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
          ports:
            - containerPort: 6379
