---
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: replica2
  labels:
    app: busybox2
spec:
  selector:
    matchLabels:
      app: replica2
  template:
    metadata:
      labels:
        app: replica2
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      runtimeClassName: kata
      shareProcessNamespace: true
      securityContext:
        supplementalGroups:
          - 10
      containers:
        - name: busy
          image: "mcr.microsoft.com/aks/e2e/library-busybox:master.220314.1-linux-amd64"
          ports:
            - containerPort: 6379
  replicas: 3
