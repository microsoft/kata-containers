---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-map3
data:
  simple_value1: value1
  simple_value2: value2
---
apiVersion: v1
kind: Pod
metadata:
  name: cm3
  labels:
    run: busybox
  annotations:
    io.katacontainers.config.hypervisor.cc_init_data: 
spec:
  restartPolicy: Never
  runtimeClassName: kata
  securityContext:
    supplementalGroups:
      - 10
  containers:
    - name: busybox
      image: "mcr.microsoft.com/aks/e2e/library-busybox:master.220314.1-linux-amd64"
      securityContext:
        privileged: true
      envFrom:
        - configMapRef:
            name: config-map3
      command:
        - /bin/sh
      args:
        - "-c"
        - while true; do echo $simple_value1; echo $simple_value2; sleep 10; done
