---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      runtimeClassName: kata
      containers:
        - name: backend
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
          image: "marinerconfpodstest.azurecr.io/hashicorp/http-echo:latest"
          args:
            - "-text=Hello from Backend"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
