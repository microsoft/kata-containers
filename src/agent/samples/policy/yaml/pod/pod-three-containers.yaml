---
apiVersion: v1
kind: Pod
metadata:
  name: three-containers
  labels:
    run: busybox
  annotations:
    io.katacontainers.config.hypervisor.cc_init_data: 
spec:
  restartPolicy: Never
  runtimeClassName: kata
  shareProcessNamespace: true
  securityContext:
    supplementalGroups:
      - 10
  initContainers:
    - name: busybox
      image: "marinerconfpodstest.azurecr.io/library-busybox:master.220314.1-linux-amd64"
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
      command:
        - /bin/echo
        - hello
    - name: mariner-cli
      image: "marinerconfpodstest.azurecr.io/azure-cli:2.58.0-cbl-mariner2.0-amd64"
      command:
        - az
        - "--help"
  containers:
    - name: go
      env:
        - name: HOST_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.hostIP
      image: "marinerconfpodstest.azurecr.io/go:1.19-bullseye_20230324.1"
      securityContext:
        allowPrivilegeEscalation: false
      terminationMessagePath: /dev/termination-custom-log
