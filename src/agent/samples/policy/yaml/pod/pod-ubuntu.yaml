---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 1000000
globalDefault: false
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    run: ubuntu
  name: ubuntu
  annotations:
    io.katacontainers.config.hypervisor.cc_init_data: 
spec:
  containers:
    - name: ubuntu-main
      image: "mcr.microsoft.com/mirror/docker/library/ubuntu:18.04"
      command:
        - /bin/bash
        - "-c"
        - "--"
      args:
        - while true; echo hi; do sleep 30; done;
  runtimeClassName: kata
  priorityClassName: high-priority
