---
apiVersion: v1
kind: Pod
metadata:
  name: many-layers
  annotations:
    io.katacontainers.config.hypervisor.cc_init_data: 
spec:
  terminationGracePeriodSeconds: 0
  restartPolicy: Never
  runtimeClassName: kata
  containers:
    - name: footloose
      image: "quay.io/footloose/ubuntu18.04:latest"
      command:
        - sh
        - "-c"
        - while true; do echo go; sleep 25; done
    - name: bootloose
      image: "quay.io/k0sproject/bootloose-ubuntu22.04:latest"
      command:
        - sh
        - "-c"
        - while true; do echo go; sleep 25; done
    - name: nginx
      image: "marinerconfpodstest.azurecr.io/azurelinux/base/nginx:1.25"
      command:
        - sh
        - "-c"
        - while true; do echo nginx; sleep 10; done
