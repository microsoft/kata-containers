---
apiVersion: v1
kind: Pod
metadata:
  name: spark
  annotations:
    io.katacontainers.config.hypervisor.cc_init_data: 
spec:
  restartPolicy: Never
  runtimeClassName: kata
  securityContext:
    supplementalGroups:
      - 1
      - 2
      - 3
      - 4
      - 6
      - 10
      - 11
      - 20
      - 26
      - 27
  containers:
    - name: spark
      image: "marinerconfpodstest.azurecr.io/spark2.4:v4_mini"
  topologySpreadConstraints:
    - maxSkew: 1
      minDomains: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          kubernetes.azure.com/os-sku: Mariner
      matchLabelKeys:
        - pod-template-hash
      nodeAffinityPolicy: Ignore
      nodeTaintsPolicy: Ignore
