---
apiVersion: v1
kind: Pod
metadata:
  name: azure-file-secrets
  labels:
    run: busybox
  annotations:
    io.katacontainers.config.hypervisor.cc_init_data: 
spec:
  restartPolicy: Never
  runtimeClassName: kata
  securityContext:
    supplementalGroups:
      - 10
  containers:
    - name: busybox
      image: "mcr.microsoft.com/aks/e2e/library-busybox:master.220314.1-linux-amd64"
      securityContext:
        readOnlyRootFilesystem: true
      volumeMounts:
        - mountPath: /mnt/perfshare
          name: perfshare
  volumes:
    - name: perfshare
      azureFile:
        secretName: azure-secret
        shareName: tempshare
        readOnly: false
