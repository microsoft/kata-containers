---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      name: web
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
spec:
  podManagementPolicy: Parallel
  serviceName: nginx
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
      annotations:
        io.katacontainers.config.hypervisor.cc_init_data: 
    spec:
      runtimeClassName: kata
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - foo
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 22222
      containers:
        - name: nginx
          image: "marinerconfpodstest.azurecr.io/azurelinux/base/nginx:1.25"
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: wwwtest
          ports:
            - containerPort: 80
              name: web
          command:
            - /bin/sh
          args:
            - "-c"
            - while true; do echo $(META_NAME); sleep 10; done
          env:
            - name: META_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
  volumeClaimTemplates:
    - metadata:
        name: wwwtest
      spec:
        storageClassName: default
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  minReadySeconds: 1
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 20%
      partition: 1
  revisionHistoryLimit: 9
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
