apiVersion: v1
kind: Pod
metadata:
  name: pod1
spec:
  terminationGracePeriodSeconds: 0
  restartPolicy: Never
  runtimeClassName: kata
  containers:
    - name: first-test-container
      image: quay.io/prometheus/busybox:latest
      env:
        - name: CONTAINER_NAME
          value: "first-test-container"
      command:
        - tail
        - -f
        - /dev/null
