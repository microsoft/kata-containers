apiVersion: v1
kind: Pod
metadata:
  name: pod3
  annotations:
    io.katacontainers.config.hypervisor.guest_vm_id: guest1
spec:
  terminationGracePeriodSeconds: 0
  restartPolicy: Never
  runtimeClassName: kata
  containers:
    - name: first-test-container
      image: ubuntu:latest
      env:
        - name: CONTAINER_NAME
          value: "first-test-container"
      command:
        - tail
        - -f
        - /dev/null
