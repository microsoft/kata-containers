apiVersion: v1
kind: Pod
metadata:
  name: test-shared-volume
spec:
  runtimeClassName: kata
  restartPolicy: Never
  volumes:
  - name: shared-data
    emptyDir: {}
  containers:
  - name: busybox-first-container
    image: quay.io/prometheus/busybox:latest
    volumeMounts:
    - name: shared-data
      mountPath: /tmp
    command: ["/bin/sh"]
    args: ["-c", "tail -f /dev/null"]
  - name: busybox-second-container
    image: quay.io/prometheus/busybox:latest
    volumeMounts:
    - name: shared-data
      mountPath: /tmp
    command: ["/bin/sh"]
    # TODO: remove this sleep command after fixing https://github.com/kata-containers/kata-containers/issues/12589
    args: ["-c", "sleep 1s ; echo Hello from the busybox-second-container > /tmp/pod-data && tail -f /dev/null"]
